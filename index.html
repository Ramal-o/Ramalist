<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramalist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="secTop">
            <div id="secLogo">
                <img src="logoRamalist.webp" alt="logo Ramalist">
            </div>
            <div id="secSearchBar">
                <input type="text" id="searchBar" placeholder="rechercher..." >
            </div>
            <div id="secParametre">
                <img src="trois-trait-fermer.png">
            </div>
        </div>
    </header>
    <div id="page">
        <div id="accueil">
            <section id="see">
                <div id="secSeeTop">
                    <div id="secSeeTitle">
                        <h2>Déja vu :</h2>
                    </div>
                    <div id="add-logo">
                        <img src="add-logo.png" alt="ajouter un anime/manhwa/manga déjà vu/lu">
                    </div>
                </div>
                <div id="seeBox">
                    <div class="colSee">
                        <div class="secImg">
                            <div class="seeImg"></div>
                        </div>
                        <div class="secName">
                            <span class="seeName">Nom de l'anime</span>
                        </div>
                </div>
            </div>
            </section>
        </div>
    </div>
    <div id="screenAnimanga">
            <div id="secAnimanga"></div>
        </div>
    
    <script src="script.js"></script>
</body>
</html>
